<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" fill="none">
<defs>
  <linearGradient id="card" x1="930" y1="170" x2="1460" y2="850" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F4F3FF"/>
  </linearGradient>
  <linearGradient id="shirt" x1="220" y1="540" x2="610" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7B6AF2"/>
    <stop offset="1" stop-color="#5A4BE8"/>
  </linearGradient>
  <linearGradient id="bubble" x1="300" y1="150" x2="430" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#7568F2"/>
    <stop offset="1" stop-color="#5143DD"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5143DD" flood-opacity=".13"/>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>


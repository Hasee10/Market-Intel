<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000"
     width="1500" height="1000" role="img" aria-labelledby="title desc">
  <title id="title">Ryvl competitive intelligence illustration</title>
  <desc id="desc">Editable flat vector artwork showing a seller reviewing market benchmarks on a large screen and synced mobile devices.</desc>

  <defs>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#111C4E" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111C4E" flood-opacity="0.10"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="405" y="194" width="790" height="456" rx="24"/>
    </clipPath>
  </defs>

  <!-- Soft abstract backdrop -->
  <path d="M355 690C260 582 292 356 486 261C660 176 760 112 964 147C1149 179 1281 321 1264 505C1248 681 1094 774 924 797C732 822 484 838 355 690Z"
        fill="#EEF2FF"/>
  <circle cx="1198" cy="257" r="62" fill="#F7F9FF"/>
  <circle cx="317" cy="451" r="38" fill="#F7F9FF"/>
  <circle cx="1270" cy="563" r="29" fill="#F7F9FF"/>

  <!-- Main monitor -->
  <g filter="url(#shadow)">
    <rect x="370" y="155" width="860" height="570" rx="42" fill="#111C4E"/>
    <rect x="386" y="171" width="828" height="536" rx="32" fill="#4318FF"/>
    <rect x="405" y="194" width="790" height="456" rx="24" fill="#FFFFFF"/>
    <rect x="405" y="194" width="790" height="68" rx="24" fill="#F7F9FF"/>
    <rect x="405" y="238" width="790" height="24" fill="#F7F9FF"/>

    <!-- Ryvl chevron mark -->
    <g transform="translate(436 214)" fill="none" stroke="#4318FF" stroke-width="11"
       stroke-linejoin="miter" stroke-linecap="square">
      <path d="M0 0L20 18L0 36"/>
      <path d="M23 0L43 18L28 33L44 49"/>
    </g>

    <!-- top chrome -->
    <rect x="506" y="218" width="80" height="10" rx="5" fill="#CFD6F2"/>
    <rect x="506" y="236" width="50" height="8" rx="4" fill="#E1E6F6"/>
    <circle cx="1152" cy="226" r="18" fill="#111C4E"/>
    <path d="M1145 218h14M1152 218v17" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Dashboard content -->
    <g clip-path="url(#screenClip)">
      <rect x="438" y="292" width="470" height="150" rx="22" fill="#F7F9FF"/>
      <rect x="928" y="292" width="234" height="150" rx="22" fill="#F7F9FF"/>

      <!-- comparison header -->
      <rect x="466" y="319" width="116" height="12" rx="6" fill="#111C4E"/>
      <rect x="605" y="319" width="92" height="12" rx="6" fill="#9DA9CE"/>
      <rect x="466" y="354" width="290" height="17" rx="8.5" fill="#DCE2F5"/>
      <rect x="466" y="354" width="220" height="17" rx="8.5" fill="#4318FF"/>
      <circle cx="686" cy="362.5" r="9" fill="#FFB547"/>

      <!-- small benchmark columns -->
      <g fill="#91A2E8">
        <rect x="488" y="391" width="11" height="25" rx="3"/>
        <rect x="510" y="380" width="11" height="36" rx="3"/>
        <rect x="532" y="387" width="11" height="29" rx="3"/>
        <rect x="554" y="368" width="11" height="48" rx="3"/>
        <rect x="576" y="377" width="11" height="39" rx="3"/>
        <rect x="598" y="360" width="11" height="56" rx="3"/>
        <rect x="620" y="371" width="11" height="45" rx="3"/>
        <rect x="642" y="383" width="11" height="33" rx="3"/>
        <rect x="664" y="373" width="11" height="43" rx="3"/>
        <rect x="686" y="392" width="11" height="24" rx="3"/>
        <rect x="708" y="379" width="11" height="37" rx="3"/>
      </g>
      <path d="M481 400C530 386 574 402 619 376C661 351 701 378 742 358"
            fill="none" stroke="#4318FF" stroke-width="5" stroke-linecap="round"/>

      <!-- right market bars -->
      <rect x="953" y="319" width="112" height="10" rx="5" fill="#B4BEDD"/>
      <rect x="953" y="340" width="78" height="8" rx="4" fill="#D5DCF0"/>
      <rect x="972" y="380" width="35" height="39" rx="6" fill="#9DA9CE"/>
      <rect x="1020" y="349" width="35" height="70" rx="6" fill="#4318FF"/>
      <rect x="1068" y="367" width="35" height="52" rx="6" fill="#7185DB"/>
      <path d="M972 369H1103" stroke="#DCE2F5" stroke-width="3"/>

      <!-- metric cards -->
      <g>
        <rect x="438" y="468" width="220" height="118" rx="20" fill="#F7F9FF"/>
        <rect x="675" y="468" width="220" height="118" rx="20" fill="#F7F9FF"/>
        <rect x="912" y="468" width="250" height="118" rx="20" fill="#F7F9FF"/>

        <circle cx="482" cy="517" r="24" fill="#EAEFFF"/>
        <path d="M482 529V505M472 515L482 505L492 515" fill="none" stroke="#4318FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="521" y="495" width="75" height="10" rx="5" fill="#A7B2D4"/>
        <rect x="521" y="519" width="48" height="18" rx="9" fill="#111C4E"/>
        <rect x="521" y="549" width="94" height="8" rx="4" fill="#D4DBEF"/>

        <circle cx="719" cy="517" r="24" fill="#EAEFFF"/>
        <path d="M719 529V505M709 515L719 505L729 515" fill="none" stroke="#4318FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="758" y="495" width="75" height="10" rx="5" fill="#A7B2D4"/>
        <rect x="758" y="519" width="44" height="18" rx="9" fill="#111C4E"/>
        <rect x="758" y="549" width="94" height="8" rx="4" fill="#D4DBEF"/>

        <circle cx="956" cy="517" r="24" fill="#EAEFFF"/>
        <path d="M956 529V505M946 515L956 505L966 515" fill="none" stroke="#4318FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="995" y="495" width="92" height="10" rx="5" fill="#A7B2D4"/>
        <rect x="995" y="519" width="44" height="18" rx="9" fill="#111C4E"/>
        <rect x="995" y="549" width="112" height="8" rx="4" fill="#D4DBEF"/>
      </g>
    </g>

    <!-- stand -->
    <path d="M709 706H887L916 792H680Z" fill="#111C4E"/>
    <path d="M680 792H916L962 826H634Z" fill="#28377D"/>
    <rect x="607" y="817" width="382" height="28" rx="14" fill="#111C4E"/>
  </g>

  <!-- Left phone -->
  <g transform="translate(188 538) rotate(-3 85 150)" filter="url(#softShadow)">
    <rect x="0" y="0" width="170" height="300" rx="28" fill="#111C4E"/>
    <rect x="10" y="10" width="150" height="280" rx="22" fill="#4318FF"/>
    <rect x="20" y="38" width="130" height="232" rx="16" fill="#FFFFFF"/>
    <rect x="62" y="18" width="46" height="7" rx="3.5" fill="#D7DDF0"/>
    <g transform="translate(33 54)" fill="none" stroke="#4318FF" stroke-width="5">
      <path d="M0 0L10 9L0 18"/>
      <path d="M12 0L22 9L15 16L23 24"/>
    </g>
    <rect x="34" y="92" width="66" height="12" rx="6" fill="#111C4E"/>
    <rect x="34" y="118" width="85" height="8" rx="4" fill="#D4DBEF"/>
    <g fill="#7185DB">
      <rect x="36" y="201" width="12" height="42" rx="3"/>
      <rect x="56" y="185" width="12" height="58" rx="3"/>
      <rect x="76" y="168" width="12" height="75" rx="3"/>
      <rect x="96" y="190" width="12" height="53" rx="3"/>
      <rect x="116" y="154" width="12" height="89" rx="3" fill="#4318FF"/>
    </g>
  </g>

  <!-- Right tablet -->
  <g transform="translate(1190 582) rotate(5 95 130)" filter="url(#softShadow)">
    <rect x="0" y="0" width="190" height="270" rx="30" fill="#111C4E"/>
    <rect x="11" y="11" width="168" height="248" rx="22" fill="#4318FF"/>
    <rect x="27" y="42" width="136" height="188" rx="16" fill="#FFFFFF"/>
    <rect x="52" y="19" width="86" height="8" rx="4" fill="#D5DCF0"/>
    <rect x="43" y="62" width="74" height="9" rx="4.5" fill="#A7B2D4"/>
    <rect x="43" y="82" width="50" height="7" rx="3.5" fill="#D4DBEF"/>
    <g fill="#7185DB">
      <rect x="51" y="164" width="18" height="45" rx="4"/>
      <rect x="79" y="143" width="18" height="66" rx="4"/>
      <rect x="107" y="122" width="18" height="87" rx="4" fill="#4318FF"/>
      <rect x="135" y="150" width="18" height="59" rx="4"/>
    </g>
  </g>

  <!-- Synced dotted lines -->
  <path d="M350 650C389 645 414 619 439 586" fill="none" stroke="#4318FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>
  <path d="M1124 773C1150 791 1170 799 1196 804" fill="none" stroke="#4318FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- Person -->
  <g>
    <ellipse cx="514" cy="823" rx="71" ry="15" fill="#DDE3F5"/>
    <circle cx="514" cy="388" r="30" fill="#FFB98A"/>
    <path d="M486 389C486 360 501 344 526 346C544 347 552 358 550 377C536 369 523 368 510 376C504 382 499 389 493 400C488 399 486 395 486 389Z" fill="#111C4E"/>
    <path d="M487 421C504 404 531 404 550 421L572 514C548 538 505 538 479 514Z" fill="#4318FF"/>
    <path d="M478 440L446 493L468 511L500 466Z" fill="#354AC5"/>
    <path d="M547 433L604 402L615 421L558 463Z" fill="#4318FF"/>
    <circle cx="612" cy="411" r="11" fill="#FFB98A"/>
    <path d="M492 511L484 691H519L531 542L548 691H582L568 511Z" fill="#111C4E"/>
    <path d="M480 691H524L521 719H466C464 705 470 697 480 691Z" fill="#111C4E"/>
    <path d="M544 691H586L599 719H546Z" fill="#111C4E"/>
  </g>

  <!-- Alert bubble -->
  <g filter="url(#softShadow)">
    <circle cx="1186" cy="334" r="34" fill="#FFB547"/>
    <path d="M1186 316C1175 316 1169 325 1169 336V345L1163 352H1209L1203 345V336C1203 325 1197 316 1186 316Z"
          fill="#FFFFFF"/>
    <circle cx="1186" cy="358" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Paper plane / growth motif -->
  <g transform="translate(1213 126) rotate(-8)" filter="url(#softShadow)">
    <path d="M0 31L116 0L72 80L50 49L0 31Z" fill="#FFFFFF" stroke="#8EA2F1" stroke-width="4" stroke-linejoin="round"/>
    <path d="M50 49L116 0L62 58" fill="none" stroke="#4318FF" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <path d="M1116 248C1154 212 1182 190 1223 176" fill="none" stroke="#4318FF" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 18"/>

  <!-- Small chevron growth accent -->
  <g transform="translate(1082 816)" fill="none" stroke="#4318FF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M0 0L25 -25L50 0"/>
    <path d="M28 0L53 -25L78 0"/>
  </g>
</svg>

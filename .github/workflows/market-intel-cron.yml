name: Market Intel Cron Jobs

# Vercel Hobby plan only allows cron jobs that run once per day (see
# vercel.com/docs/cron-jobs/usage-and-pricing) - the price-alerts job needs
# to run more often than that (every 6 hours), so both jobs are triggered
# from GitHub Actions instead of vercel.json, hitting the deployed app's
# /api/cron/* route handlers over HTTPS. The routes themselves still live in
# horizon-ui-chakra-nextjs-main and still require the CRON_SECRET bearer
# token (see src/lib/supabase/server.ts's isAuthorizedCronRequest) - this
# workflow is just the trigger, not the job logic.
on:
  schedule:
    - cron: "0 3 * * *" # domain_benchmarks - once daily
    - cron: "0 */6 * * *" # price-alerts diff job - every 6 hours
    - cron: "0 4 * * *" # low-stock alerts - once daily
    - cron: "0 5 * * *" # churn/RFM snapshot - once daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  benchmarks:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger domain benchmarks aggregation
        # --fail alone (with --silent) swallows the JSON error body on a
        # non-2xx response, which is exactly the info needed to debug a 500
        # from the route handler - print the body first, then fail the step
        # based on the actual HTTP status.
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/benchmarks" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  price-alerts:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger price alerts diff job
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/price-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  low-stock:
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger low stock alerts job
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/low-stock" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  churn:
    if: github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger churn/RFM snapshot job
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/churn" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

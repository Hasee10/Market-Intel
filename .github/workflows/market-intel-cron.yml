name: Market Intel Cron Jobs

# Vercel Hobby plan only allows cron jobs that run once per day (see
# vercel.com/docs/cron-jobs/usage-and-pricing) - the price-alerts job needs
# to run more often than that (every 6 hours), so both jobs are triggered
# from GitHub Actions instead of vercel.json, hitting the deployed app's
# /api/cron/* route handlers over HTTPS. The routes themselves still live in
# app and still require the CRON_SECRET bearer
# token (see src/lib/supabase/server.ts's isAuthorizedCronRequest) - this
# workflow is just the trigger, not the job logic.
on:
  schedule:
    - cron: "0 3 * * *" # domain_benchmarks - once daily
    - cron: "0 */6 * * *" # price-alerts diff job - every 6 hours
    - cron: "0 4 * * *" # low-stock alerts - once daily
    - cron: "0 5 * * *" # churn/RFM snapshot - once daily
    - cron: "0 2 * * *" # fx-rates snapshot - once daily, before benchmarks/churn use it
    # Push delivery for the mobile app. Three fixed times rather than
    # "every 6 hours" because the recipients are phones in Pakistan
    # (UTC+5): 03:30/09:30/15:30 UTC is 08:30/14:30/20:30 PKT, all waking
    # hours. A */6 schedule would have buzzed sellers at 23:30 their time,
    # which is how an app gets its notifications turned off permanently.
    # Each run picks up whatever the alert jobs above wrote since the last
    # one; the 18:00 price-alerts batch waits until the 03:30 run, well
    # inside the job's own 24h staleness window.
    - cron: "30 3,9,15 * * *" # push notifications - three times daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Runs before benchmarks/churn (needs: below) whenever either of their
  # schedules fires, in addition to its own 02:00 tick - previously "before
  # benchmarks/churn use it" (see the fx-rates cron comment above) was true
  # only because 02:00 sorts earlier than 03:00/05:00, not because anything
  # actually enforced it. Refreshing fx-rates twice on a benchmarks/churn
  # day is harmless (it's a snapshot write, safe to repeat).
  fx-rates:
    if: >
      github.event.schedule == '0 2 * * *' ||
      github.event.schedule == '0 3 * * *' ||
      github.event.schedule == '0 5 * * *' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger FX rate snapshot refresh
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/fx-rates" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  benchmarks:
    needs: fx-rates
    # always() so this doesn't get skipped just because fx-rates' own `if`
    # above didn't match on some other schedule tick (needs: otherwise
    # treats an upstream skip the same as a failure) - the real gate is the
    # second line, unchanged from before. Bracket syntax (not needs.fx-rates)
    # because GitHub Actions expressions parse a hyphen in dot notation as
    # subtraction, not a property access - needs['fx-rates'] is required.
    if: >
      always() &&
      (needs['fx-rates'].result == 'success' || needs['fx-rates'].result == 'skipped') &&
      (github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger domain benchmarks aggregation
        # --fail alone (with --silent) swallows the JSON error body on a
        # non-2xx response, which is exactly the info needed to debug a 500
        # from the route handler - print the body first, then fail the step
        # based on the actual HTTP status.
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/benchmarks" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  price-alerts:
    if: github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger price alerts diff job
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/price-alerts" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  push-notifications:
    if: github.event.schedule == '30 3,9,15 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger push notification delivery
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}"             -X POST "${{ secrets.APP_URL }}/api/cron/push-notifications"             -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  low-stock:
    if: github.event.schedule == '0 4 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger low stock alerts job
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/low-stock" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

  churn:
    needs: fx-rates
    if: >
      always() &&
      (needs['fx-rates'].result == 'success' || needs['fx-rates'].result == 'skipped') &&
      (github.event.schedule == '0 5 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger churn/RFM snapshot job
        run: |
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            -X POST "${{ secrets.APP_URL }}/api/cron/churn" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          cat response.json
          echo "HTTP status: $status"
          [ "$status" -ge 200 ] && [ "$status" -lt 300 ]

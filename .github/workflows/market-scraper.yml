name: Market Scraper

# Runs every 2 days on GitHub's own cloud runners, scraping the Pakistani
# e-commerce sources configured below (see scraper/src/sources/index.ts for
# the full active list) and writing
# to market_* Supabase tables in the same project as the seller portal
# (mantine-analytics-dashboard-dev) - fully separate namespace from sellers/
# domain_benchmarks, see scraper/migrations/001_create_market_tables.sql.
#
# The schedule below fires daily and the "Determine cadence" step below
# decides whether this is an "on" day - `cron: "30 3 */2 * *"` looks like it
# means "every 2 days" but day-of-month */2 actually means "even calendar
# days", which drifts to a 1- or 3-day gap across most month boundaries
# (day 30 -> day 2 is a 3-day gap in a 31-day month). Counting days since
# the Unix epoch instead of calendar day-of-month is immune to month length
# entirely, so the 2-day cadence is now exact forever.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scraper
    steps:
      - name: Determine cadence
        id: cadence
        # Runs before actions/checkout, so the job-level "scraper"
        # working-directory default doesn't exist yet on the runner's
        # filesystem - this step needs no repo files, just override it back
        # to the workspace root.
        working-directory: .
        run: |
          days_since_epoch=$(( $(date +%s) / 86400 ))
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] || [ $((days_since_epoch % 2)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping - off day in the every-2-days cadence (day $days_since_epoch since epoch)"
          fi

      - uses: actions/checkout@v7
        if: steps.cadence.outputs.run == 'true'

      - uses: actions/setup-node@v6
        if: steps.cadence.outputs.run == 'true'
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: scraper/package-lock.json

      - name: Install dependencies
        if: steps.cadence.outputs.run == 'true'
        run: npm install --prefer-offline

      - name: Install Chromium OS dependencies (for CloakBrowser)
        if: steps.cadence.outputs.run == 'true'
        run: npx playwright-core install-deps chromium

      - name: Run market scraper
        if: steps.cadence.outputs.run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CLOAKBROWSER_LICENSE_KEY: ${{ secrets.CLOAKBROWSER_LICENSE_KEY }}
          SCRAPER_PROXY: ${{ secrets.SCRAPER_PROXY }}
          # Category/collection values here are literal per-site URL paths or
          # IDs (see scraper/src/sources/*.ts), not free-form labels - each
          # was verified live against the real site nav before being added.
          # iShopping/Goto are left at their original 2 - both are blocked
          # from casual verification (403 / expired TLS cert respectively,
          # matches the Cloudflare/TLS friction already noted in
          # new_implementation_doc.md's Phase 6). SapphireOnline is also
          # unchanged: its public nav uses Shopify-style /collections/ paths,
          # but the scraper (sapphireonline.ts) hits a Demandware endpoint
          # keyed on internal `cgid` values, which aren't the same thing -
          # applying the nav paths as cgids would likely just fail silently.
          #
          # OLX_CATEGORIES is intentionally not set here (2026-08-03): OLX is
          # disabled in scraper/src/sources/index.ts (CLASSIFIED_SOURCES is
          # empty) after weeks of every request from this runner IP range
          # coming back 429, including after pacing + exponential backoff
          # were added - see the comment on CLASSIFIED_SOURCES for the full
          # reasoning. Re-add this env var alongside re-enabling scrapeOlx in
          # that array if a proxy fix (SCRAPER_PROXY) resolves the block.
          #
          # DARAZ_CATEGORIES (2026-08-03, ROADMAP.md D1). Every slug below was
          # fetched live and confirmed to return on-topic listings - Daraz
          # returns a hard error for unknown slugs rather than an empty page,
          # so a typo here is loud, not silent. Only category paths appear:
          # daraz.pk/robots.txt disallows /catalog/ (the search endpoint) and
          # /shop/*.htm (seller storefronts), so neither is ever requested.
          # See SCRAPING.md. This is the largest source by request volume (22
          # categories x up to 15 pages, now through CloakBrowser with
          # randomised 2.5-6s/page and 8-15s/category delays plus retries on
          # a block page) - the main reason timeout-minutes stays well above
          # the pre-hardening baseline even with OLX removed.
          PRICEOYE_CATEGORIES: mobiles,laptops,tablets,smart-watches,wireless-earbuds,power-banks,bluetooth-speakers
          TELEMART_COLLECTIONS: mobiles-tablets,laptops-1,mens-fashion,womens-fashion
          SHOPHIVE_CATEGORIES: apple/iphone,laptops-computers/laptops,mobile-phones,tablets
          ISHOPPING_CATEGORIES: mobiles,laptops
          GOTO_CATEGORIES: computing-gaming,mens-fashion,womens-fashion
          SAPPHIREONLINE_CATEGORIES: ready-to-wear,unstitched
          DARAZ_CATEGORIES: smartphones,laptops,phones-tablets,audio,televisions,laptop-accessories,mens-fashion,womens-fashion,mens-shoes,womens-shoes,jewellery,sunglasses,beauty-health,home-appliances,kitchen-dining,furniture-decor,stationery-craft,books-magazines,toys-games,mother-baby,exercise-fitness,automotive
          #
          # Sources added 2026-08-03 to replace the coverage OLX used to
          # provide. Every slug below was fetched live and confirmed to return
          # real product cards before being added - mega returns HTTP 500 for
          # an unknown slug rather than an empty page, so a typo there is loud.
          #
          # naheed + shopperspk are the important ones: they are the first
          # sources with genuine depth in grocery, beauty, home, kids and
          # kitchen, which is where 10 of 12 seller categories had no retailer
          # coverage at all.
          MEGA_CATEGORIES: laptops,mobiles,desktopcomputers,smartwatches,airconditioners,ledtv,refrigerators,microwaveovens
          NAHEED_CATEGORIES: phones-tablets,health-beauty,kids-babies,home-lifestyle,groceries-pets,tv-home-appliances,books,men-s-fashion
          VMART_COLLECTIONS: apple-phones,apple-macbooks-pakistan,audio-pakistan,gaming-mouse-pakistan,gaming-keyboards-pakistan,gaming-headsets-pakistan,accessories-pakistan
          SHOPPERSPK_CATEGORIES: home-decor,jars-containers,serving-dishes-in-pakistan,water-bottles-in-pakistan,wall-clocks-in-pakistan,mugs-in-pakistan,air-fryers,baby
          #
          # Added 2026-08-29: 5 new Shopify storefronts (see sources/shopify-
          # source.ts), filling beauty/home/toys/fashion gaps. Every handle
          # below was fetched live against each site's own /collections.json
          # AND its actual products.json endpoint (not just the listing) to
          # confirm the collection currently has published products - two of
          # the first picks (gulahmed's 2-piece-khaddar, chasevalue's fryer)
          # looked valid in /collections.json but returned zero live products
          # (products_count: 0 - a real collection that's just currently
          # empty), caught only by actually calling products.json before
          # shipping. See migrations/032_add_new_retailer_sources.sql. Khaadi
          # was evaluated from the same target list and rejected: its
          # robots.txt disallows /women/, essentially its whole catalog.
          BAGALLERY_COLLECTIONS: all-beauty,all-skincare,beauty-accessories-tools,baby-care-1
          JUNAIDJAMSHED_COLLECTIONS: skin-care-body-care,womens-bags,fragrances-collection,3-piece
          GULAHMED_COLLECTIONS: ideas-home-bed-sheets,ideas-home-bath-linen,women-ideas-pret,mens-clothes-eastern-shalwar-kameez
          CHASEVALUE_COLLECTIONS: home-fragrances,home-lifestyle-heater,kids-action-figures,beauty-personal-care-shaving
          ALFATAH_COLLECTIONS: air-fryer-price-in-pakistan,activity-toys,after-shave-price-in-pakistan,alarm-wall-clocks
          #
          # Added 2026-08-29, second batch: Springs/Outfitters/SEW Markaz
          # (Shopify) + Petshub.pk (WooCommerce Store API). Every handle below
          # was fetched live against its actual products.json/Store API
          # endpoint (not just the collection/category listing) and confirmed
          # to return real product rows before being added - see
          # migrations/033_add_second_retailer_batch.sql. Symbios.pk (dead
          # host, serves a hosting-panel splash page) and METRO Pakistan (hard
          # 403 bot block) were evaluated and rejected from the same candidate
          # list; Homeshopping.pk (VTEX headless commerce) and Idealancy.pk
          # (custom platform, JSON-LD only) are real stores but need dedicated
          # integration work and are deferred, not added here.
          SPRINGS_COLLECTIONS: chips-snacks-popcorn,cleaning,baby-products,beauty-accessories-tools
          OUTFITTERS_COLLECTIONS: boys-most-popular-products,girls-most-popular-products,accessories-women,junior-boy-shoes
          SEWMARKAZ_COLLECTIONS: home-decor,kitchen-dining,household-essentials,baskets-organizers
          PETSHUB_CATEGORIES: cat-foods-in-pakistan,dog-foods-in-pakistan,cat-accessories-in-pakistan,dog-accessories-in-pakistan
          #
          # Added 2026-08-29, third batch: fashion (Zellbury, Bonanza
          # Satrangi, Beechtree, Nishat Linen) + furniture/home (Interwood,
          # Habitt, Poshish, Woods, ChenOne) - all Shopify - plus Petfit.pk
          # and Luminaria.pk (WooCommerce Store API). Every handle below was
          # fetched live against its actual products.json/Store API endpoint
          # (not just the collection/category listing) and confirmed to
          # return real product rows before being added - see
          # migrations/034_add_third_retailer_batch.sql. Ethnic/Highfy/
          # Malabis were evaluated and rejected from the same candidate list
          # - every domain variant resolved to a parked or unrelated page,
          # not a real store. Nested.pk is a real store but a heavily
          # client-rendered SPA with no server-rendered product data -
          # deferred, needs its backend API investigated separately.
          ZELLBURY_COLLECTIONS: women,men,ready-to-wear,women-bags
          BONANZASATRANGI_COLLECTIONS: new-in-unstitched,mens,fragrances,ready-to-wear
          BEECHTREE_COLLECTIONS: best-seller-pret,embroidered-pret,accessories,embroidered-pret-2-piece
          NISHATLINEN_COLLECTIONS: accessories,embroidered-pret,embroidered-unstitched,bags-summer-2025
          INTERWOOD_COLLECTIONS: living,bedroom,sofas-all,office
          HABITT_COLLECTIONS: craft-furniture,all-dining-room-tables,chester-sideboards,blue-pottery
          POSHISH_COLLECTIONS: living,bedroom,sofas,dining
          WOODS_COLLECTIONS: double-beds-for-bedroom,workstations,wardrobes,computer-tables
          CHENONE_COLLECTIONS: men-western-wear,men,home-textile,chenone-home-accessories
          PETFIT_CATEGORIES: cat,dog,pet-accessories,pet-grooming
          LUMINARIA_CATEGORIES: home-decor,sculptures,vases-urns,bathroom-essentials
          #
          # Added 2026-08-29, fourth batch: targeting Sports & Outdoors, the
          # weakest-covered seller category (2 sources before this).
          # Alisports/Bodybrics/HustlersOnlyPK/ActivitySphere are Shopify.
          # Zeesol Store is WooCommerce - its Store API needs numeric
          # category IDs, not slugs (confirmed live: the slug filter
          # returned an empty array despite the category genuinely having
          # 124 products) - see migrations/037 and config.ts for the full
          # explanation. Every handle/ID below was fetched live against its
          # actual products.json/Store API endpoint before being added.
          # TheSportStore.pk was evaluated and deferred: real site, but runs
          # OpenCart with no standard product-feed endpoint.
          ALISPORTS_COLLECTIONS: badminton,cricket,badminton-rackets,exercise-fitness
          BODYBRICS_COLLECTIONS: accessories,t-shirts-tops,mens-pants-trousers-joggers,all-women
          HUSTLERSONLYPK_COLLECTIONS: fitness-apparel,apparel-men,women-apparel,tops
          ACTIVITYSPHERE_COLLECTIONS: women-gym-wear,men-gym-wear,women-sports-bra,men-gym-shirts
          ZEESOL_CATEGORIES: 3962,3961,3966,3963
          #
          # Added 2026-08-29, fifth batch: Books & Stationery, Automotive,
          # Coffee & Beverages - closing out the same brief the Sports &
          # Outdoors batch started. BlingSpot/Katib/Mercury Stationery,
          # SehgalMotors/AsadAutos/PakistanMotors/PremiumExo,
          # CoffeeCrest/Snapcart are Shopify. Stationery.pk/Assany.pk/
          # Autostore.pk are WooCommerce (slugs work fine, unlike Zeesol
          # above). Every handle below was fetched live against its actual
          # products.json/Store API endpoint before being added - see
          # migrations/038. Waqarmart.pk was evaluated and deferred: a
          # custom Laravel-based platform with no standard product-feed
          # endpoint.
          BLINGSPOT_COLLECTIONS: school-supplies,kids-stationery,journals-notebooks,notepads
          KATIB_COLLECTIONS: art-and-craft,copy-and-printer-paper,account-books,data-storage
          MERCURYSTATIONERY_COLLECTIONS: all-pencils,all-pens,lead-pencils,brito
          STATIONARYPK_CATEGORIES: writing-essentials,office-supplies,school-supplies-pakistan,lead-pencil-pakistan
          ASSANY_CATEGORIES: stationery,arts-crafts,packaging-material,wall-racks-organizers
          SEHGALMOTORS_COLLECTIONS: auto-spare-parts,body-kits-extensions,bike-accessories,air-press-sunvisors
          ASADAUTOS_COLLECTIONS: honda,all-type-of-mats,haval,goodyear-wiper-blades
          PAKISTANMOTORS_COLLECTIONS: interior-accessories,led-lightening-accessories,car-top-covers,exterior-accessories
          PREMIUMEXO_COLLECTIONS: car-window-sunshades-pakistan,toyota-sunshades-pakistan,honda-sunshades-pakistan,back-rear
          AUTOSTOREPK_CATEGORIES: car-accessories,body-kits,car-care,car-parts
          COFFEECREST_COLLECTIONS: beverages-drinks,syrups,single-origin,blends
          SNAPCART_COLLECTIONS: tea-coffee,drinks,juices-malts-smoothies,soft-drinks-soda
          #
          # Added 2026-08-29, sixth batch: Health & Wellness (previously
          # weak) + 2 more pet-supply sources + 2 more coffee/tea specialty
          # roasters - researched live via web search this round, no
          # specific sites named in the brief. Every handle below was
          # fetched live against its actual products.json/Store API
          # endpoint before being added - see migrations/039, which also
          # formalizes "Pet Supplies" as its own seller category (was
          # mapped to the catch-all 'other' before).
          WELLPAKISTAN_COLLECTIONS: health-wellness,health-care-supplements,multivitamins,nutritional-supplements
          MYVITAMINSTORE_COLLECTIONS: bone-muscle-joint-health-supplements,energy-vitality-supplements,brain-health,calcium-magnesium
          GINNASTICNUTRITION_COLLECTIONS: post-workout,diabetes,brain-health,pre-workout
          PETMASTER_COLLECTIONS: cats,dog,cat-treats,dog-dry-food-1
          PETSPARK_COLLECTIONS: cat-accessories,dogs,dog-accessories,cat-dry-food
          EPETSTOREPK_CATEGORIES: cat-food-in-pakistan,pet-accessories-in-pakistan,dog-accessories-in-pakistan,dog-food-in-pakistan
          SCAFE_COLLECTIONS: coffee,single-origin,flavoured-syrups,matcha
          REDBERRYROASTERS_COLLECTIONS: all-coffee,single-origin-coffee,espresso-coffee,medium-coffee
        run: npm run start
